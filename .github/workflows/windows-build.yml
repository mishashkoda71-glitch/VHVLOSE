name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build desktop client
        run: dotnet build .\Client\VHVLOSE.Client.csproj -c Release

      - name: Build launcher
        run: dotnet build .\Launcher\VHVLOSE.Launcher.csproj -c Release
